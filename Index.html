<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>حجز المختبر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f7;--card:#fff;--ink:#14303a;--muted:#687d86;--line:#e1e8ec;
  --brand:#0f5e6e;--brand2:#14899d;--free:#1a8f53;--freebg:#effaf3;--freeline:#b9e3ca;
  --danger:#c0392b;--shadow:0 1px 2px rgba(16,40,50,.06),0 6px 18px rgba(16,40,50,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px 18px}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex:none}
@media(max-width:420px){.hbtn{padding:7px 8px;font-size:12px}h1{font-size:17px!important}.week .range{font-size:13.5px}}
h1{margin:0;font-size:19px;font-weight:800;line-height:1.2}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.26)}
.adminbar{max-width:1100px;margin:10px auto 0;background:rgba(0,0,0,.18);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.adminbar[hidden]{display:none}
.adminbar b{margin-inline-end:auto}
.adminbar button{background:#fff;color:var(--brand);border:0;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.week{display:flex;align-items:center;gap:8px;margin:0 0 10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px;position:relative}
.week button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--brand)}
.week .range{flex:1;text-align:center;font-weight:800;font-size:15px}
.week .range small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.week .now{font-size:12.5px;padding:8px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin:0 2px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.days{display:grid;gap:12px;padding-bottom:28px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.day.today{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(20,137,157,.22),var(--shadow)}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:#fafcfd}
.dayhead h3{margin:0;font-size:16px;font-weight:800}
.dayhead h3 small{font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:6px}
.tag{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--brand2);color:#fff;margin-inline-start:6px;vertical-align:middle}
.count{font-size:12.5px;color:var(--muted);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}
@media(min-width:780px){.slots{grid-template-columns:repeat(var(--n),1fr)}}
.slot{min-height:80px;border-radius:11px;padding:7px 8px;text-align:right;border:1.5px solid;display:flex;flex-direction:column;gap:1px;position:relative;transition:transform .12s,box-shadow .12s;overflow:hidden;color:inherit;background:none}
.slot:not(.past):hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.slot .pn{font-size:12px;font-weight:800}
.slot .tm{font-size:10.5px;opacity:.75}
.slot .st{margin-top:auto;font-weight:700;font-size:13px}
.slot.free{background:var(--freebg);border-color:var(--freeline);border-style:dashed;color:var(--free)}
.slot.booked{background:var(--c);border-color:var(--c);color:#fff}
.slot.booked .who{margin-top:auto;font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.booked .meta{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lock{position:absolute;left:7px;top:6px;font-size:11px;opacity:.9}
.slot.closed{background:repeating-linear-gradient(-45deg,#eef1f3 0 6px,#e5e9ec 6px 12px);border-color:#d4dbdf;color:#6a7a82}
.slot.past{cursor:default}
.slot.free.past{background:#f5f7f8;border-color:#e3e8eb;color:#a3afb5}
.slot.booked.past{opacity:.6}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.spin{display:block;width:34px;height:34px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--brand2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loaderr{background:var(--card);border:1px solid #f3c7c1;border-radius:14px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)}
.loaderr .ic{font-size:34px}
.loaderr b{display:block;font-size:17px;margin:6px 0}
.loaderr p{color:var(--muted);margin:6px 0 14px;line-height:1.7}
.loaderr .btn{max-width:240px;margin:auto;display:block}
.loaderr .hint{font-size:12.5px;margin:14px 0 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,38,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
@media(max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-width:none}}
.shead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.shead .dot{width:12px;height:40px;border-radius:6px;flex:none}
.shead h2{margin:0;font-size:18px;font-weight:800}
.shead p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.shead .x{margin-inline-start:auto;border:0;background:#f0f3f5;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;color:var(--muted);flex:none}
.sbody{padding:14px 18px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:5px}
.field label em{font-style:normal;color:var(--muted);font-weight:500}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fbfcfd;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand2);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{margin:0}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--c)}
.chips input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.note{background:#fff7e6;border:1px solid #f6d999;color:#7a5600;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.6;margin:4px 0 2px}
.lockbox{background:#f3f6f8;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.7;text-align:center;margin-top:8px}
.lockbox b{display:block;font-size:15px;margin-bottom:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px}
.info dt{color:var(--muted);font-weight:500}
.info dd{margin:0;font-weight:700}
.sfoot{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:15px;background:#eef2f4;color:var(--ink);min-width:110px}
.btn.primary{background:var(--brand);color:#fff}
.btn.danger{background:#fdecea;color:var(--danger)}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:#14303a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#1a8f53}.toast.err{background:var(--danger)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 22px}
.labs{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:8px;margin:-12px 0 10px;position:relative}
.labtab{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,background .15s;min-width:0}
.labtab:hover{border-color:var(--lc)}
.labtab .ic{font-size:24px;line-height:1}
.labtab .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.labtab .ct{font-size:11.5px;color:var(--muted);font-weight:700}
.labtab.on{background:var(--lc);border-color:var(--lc);color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.labtab.on .ct{color:rgba(255,255,255,.88)}
@media(max-width:480px){.labs{gap:6px}.labtab{padding:8px 2px 7px;border-radius:12px}.labtab .nm{font-size:12.5px;white-space:normal;line-height:1.2;text-align:center}.labtab .wl{display:none}.labtab .ic{font-size:20px}.labtab .ct{font-size:10.5px}}
@media print{
  header .hbtns,.adminbar,.labs,.week button,.legend,footer{display:none!important}
  body{background:#fff}header{background:none;color:#000;padding:0 0 8px}
  .week{box-shadow:none;margin:0 0 8px}.day{box-shadow:none;break-inside:avoid}
  .slots{grid-template-columns:repeat(var(--n),1fr)!important}
  .slot{-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:60px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <div class="logo" id="logo">🧪</div>
      <div><h1 id="labName">حجز المختبرات</h1><p id="schoolName">جاري التحميل…</p></div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="shareBtn" title="مشاركة الرابط في واتساب">📤 مشاركة</button>
      <button class="hbtn" id="adminBtn">🔑 الفني</button>
    </div>
  </div>
  <div class="adminbar" id="adminBar" hidden>
    <b>🔓 وضع فني المختبر مفعّل</b>
    <button id="setBtn">⚙️ الإعدادات</button>
    <button id="printBtn">🖨️ طباعة</button>
    <button id="outBtn">خروج</button>
  </div>
</header>

<div class="wrap">
  <nav class="labs" id="labs"></nav>
  <nav class="week">
    <button id="prevW" title="الأسبوع السابق">› السابق</button>
    <div class="range" id="range">—</div>
    <button class="now" id="nowW">اليوم</button>
    <button id="nextW" title="الأسبوع التالي">التالي ‹</button>
  </nav>
  <div class="legend" id="legend"></div>
  <main class="days" id="days"><div class="loading"><span class="spin"></span>جاري تحميل الجدول…</div></main>
</div>
<footer>اضغط على أي حصة متاحة للحجز • الحصص المحجوزة مقفلة ولا تُعدَّل إلا من فني المختبر</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script id="guard">
/* حارس: إذا تعطّل التحميل لأي سبب في أي متصفح، يظهر زر لإعادة التحميل بدل الانتظار بلا نهاية */
setTimeout(function () {
  var d = document.getElementById('days');
  if (d && d.querySelector && d.querySelector('.loading')) {
    d.innerHTML = '<div class="loaderr"><div class="ic">⚠️</div><b>تأخر تحميل الجدول</b>' +
      '<p>قد يكون الإنترنت ضعيفًا أو المتصفح قديمًا.</p>' +
      '<button class="btn primary" onclick="location.reload()">🔄 إعادة تحميل الصفحة</button>' +
      '<p class="hint">إذا استمرت المشكلة: افتح الرابط في متصفح Chrome أو Safari من زر ⋮ أو ••• ثم «فتح في المتصفح».</p></div>';
  }
}, 35000);
</script>
