<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حجز المختبر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f7;--card:#fff;--ink:#14303a;--muted:#687d86;--line:#e1e8ec;
  --brand:#0f5e6e;--brand2:#14899d;--free:#1a8f53;--freebg:#effaf3;--freeline:#b9e3ca;
  --danger:#c0392b;--shadow:0 1px 2px rgba(16,40,50,.06),0 6px 18px rgba(16,40,50,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px 18px}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex:none}
@media(max-width:420px){.hbtn{padding:7px 8px;font-size:12px}h1{font-size:17px!important}.week .range{font-size:13.5px}}
h1{margin:0;font-size:19px;font-weight:800;line-height:1.2}
.brand p{margin:2px 0 0;font-size:13px;opacity:.85}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.26)}
.adminbar{max-width:1100px;margin:10px auto 0;background:rgba(0,0,0,.18);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.adminbar[hidden]{display:none}
.adminbar b{margin-inline-end:auto}
.adminbar button{background:#fff;color:var(--brand);border:0;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.week{display:flex;align-items:center;gap:8px;margin:0 0 10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px;position:relative}
.week button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--brand)}
.week .range{flex:1;text-align:center;font-weight:800;font-size:15px}
.week .range small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.week .now{font-size:12.5px;padding:8px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin:0 2px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.days{display:grid;gap:12px;padding-bottom:28px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.day.today{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(20,137,157,.22),var(--shadow)}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:#fafcfd}
.dayhead h3{margin:0;font-size:16px;font-weight:800}
.dayhead h3 small{font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:6px}
.tag{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--brand2);color:#fff;margin-inline-start:6px;vertical-align:middle}
.count{font-size:12.5px;color:var(--muted);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}
@media(min-width:780px){.slots{grid-template-columns:repeat(var(--n),1fr)}}
.slot{min-height:80px;border-radius:11px;padding:7px 8px;text-align:right;border:1.5px solid;display:flex;flex-direction:column;gap:1px;position:relative;transition:transform .12s,box-shadow .12s;overflow:hidden;color:inherit;background:none}
.slot:not(.past):hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.slot .pn{font-size:12px;font-weight:800}
.slot .tm{font-size:10.5px;opacity:.75}
.slot .st{margin-top:auto;font-weight:700;font-size:13px}
.slot.free{background:var(--freebg);border-color:var(--freeline);border-style:dashed;color:var(--free)}
.slot.booked{background:var(--c);border-color:var(--c);color:#fff}
.slot.booked .who{margin-top:auto;font-weight:700;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.booked .meta{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lock{position:absolute;left:7px;top:6px;font-size:11px;opacity:.9}
.slot.closed{background:repeating-linear-gradient(-45deg,#eef1f3 0 6px,#e5e9ec 6px 12px);border-color:#d4dbdf;color:#6a7a82}
.slot.past{cursor:default}
.slot.free.past{background:#f5f7f8;border-color:#e3e8eb;color:#a3afb5}
.slot.booked.past{opacity:.6}
.loading{text-align:center;color:var(--muted);padding:40px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,38,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
@media(max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-width:none}}
.shead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.shead .dot{width:12px;height:40px;border-radius:6px;flex:none}
.shead h2{margin:0;font-size:18px;font-weight:800}
.shead p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.shead .x{margin-inline-start:auto;border:0;background:#f0f3f5;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;color:var(--muted);flex:none}
.sbody{padding:14px 18px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:5px}
.field label em{font-style:normal;color:var(--muted);font-weight:500}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fbfcfd;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand2);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{margin:0}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--c)}
.chips input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.note{background:#fff7e6;border:1px solid #f6d999;color:#7a5600;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.6;margin:4px 0 2px}
.lockbox{background:#f3f6f8;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.7;text-align:center;margin-top:8px}
.lockbox b{display:block;font-size:15px;margin-bottom:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px}
.info dt{color:var(--muted);font-weight:500}
.info dd{margin:0;font-weight:700}
.sfoot{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:15px;background:#eef2f4;color:var(--ink);min-width:110px}
.btn.primary{background:var(--brand);color:#fff}
.btn.danger{background:#fdecea;color:var(--danger)}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);background:#14303a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#1a8f53}.toast.err{background:var(--danger)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 22px}
.labs{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:8px;margin:-12px 0 10px;position:relative}
.labtab{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s,background .15s;min-width:0}
.labtab:hover{border-color:var(--lc)}
.labtab .ic{font-size:24px;line-height:1}
.labtab .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.labtab .ct{font-size:11.5px;color:var(--muted);font-weight:700}
.labtab.on{background:var(--lc);border-color:var(--lc);color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.labtab.on .ct{color:rgba(255,255,255,.88)}
@media(max-width:480px){.labs{gap:6px}.labtab{padding:8px 2px 7px;border-radius:12px}.labtab .nm{font-size:12.5px;white-space:normal;line-height:1.2;text-align:center}.labtab .wl{display:none}.labtab .ic{font-size:20px}.labtab .ct{font-size:10.5px}}
@media print{
  header .hbtns,.adminbar,.labs,.week button,.legend,footer{display:none!important}
  body{background:#fff}header{background:none;color:#000;padding:0 0 8px}
  .week{box-shadow:none;margin:0 0 8px}.day{box-shadow:none;break-inside:avoid}
  .slots{grid-template-columns:repeat(var(--n),1fr)!important}
  .slot{-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:60px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <div class="logo" id="logo">🧪</div>
      <div><h1 id="labName">حجز المختبرات</h1><p id="schoolName">جاري التحميل…</p></div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="shareBtn" title="مشاركة الرابط في واتساب">📤 مشاركة</button>
      <button class="hbtn" id="adminBtn">🔑 الفني</button>
    </div>
  </div>
  <div class="adminbar" id="adminBar" hidden>
    <b>🔓 وضع فني المختبر مفعّل</b>
    <button id="setBtn">⚙️ الإعدادات</button>
    <button id="printBtn">🖨️ طباعة</button>
    <button id="outBtn">خروج</button>
  </div>
</header>

<div class="wrap">
  <nav class="labs" id="labs"></nav>
  <nav class="week">
    <button id="prevW" title="الأسبوع السابق">› السابق</button>
    <div class="range" id="range">—</div>
    <button class="now" id="nowW">اليوم</button>
    <button id="nextW" title="الأسبوع التالي">التالي ‹</button>
  </nav>
  <div class="legend" id="legend"></div>
  <main class="days" id="days"><div class="loading">جاري تحميل الجدول…</div></main>
</div>
<footer>اضغط على أي حصة متاحة للحجز • الحصص المحجوزة مقفلة ولا تُعدَّل إلا من فني المختبر</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= الاتصال بالخادم ================= */
// رابط تطبيق الويب (Google Apps Script) — الصفحة تتصل به لحفظ وقراءة الحجوزات
const API_URL = 'https://script.google.com/macros/s/AKfycbwWCnVpHApCgJ4vPar7ciYVcNHyFyX_ZBQQ1bw9u50U0aERi8d9FGvAUS5HgbL4-7TQ/exec';

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const DEMO = /[?&]demo\b/.test(location.search);   // للمعاينة فقط: افتح الصفحة مع ?demo
async function api(fn, ...args) {
  if (DEMO) return Mock[fn](...args);
  if (IS_GAS) return new Promise((res, rej) =>
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  let r;
  try {
    r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // يتجنب مشكلة CORS مع Apps Script
      body: JSON.stringify({ action: fn, args })
    });
  } catch (e) { throw new Error('تعذر الاتصال بالخادم، تأكد من الإنترنت'); }
  if (!r.ok) throw new Error('خطأ في الخادم (' + r.status + ')');
  return r.json();
}

/* ================= أدوات ================= */
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PALETTE = ['#2d6cdf','#8b4fd1','#e07a1f','#0e8c8c','#c93d6c','#5b7a1e','#b5651d','#3949ab'];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dm = d => d.getDate() + '/' + (d.getMonth() + 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errMsg = e => (e && (e.message || e.msg)) || 'حدث خطأ، حاول مرة أخرى';
function sundayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function sstore(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

/* ================= الحالة ================= */
let cfg = { school: '', title: 'حجز المختبرات', labs: [], defaultLab: '', periods: 8, times: [], subjects: [], today: ymd(new Date()) };
let lab = null;
let items = [];
let pin = sstore('labPin') || null;
let weekStart = (() => { const t = new Date(); let s = sundayOf(t); if (t.getDay() >= 5) s = addDays(s, 7); return s; })();
let busy = false;

const subjColor = s => { const i = (cfg.subjects || []).indexOf(s); return PALETTE[(i < 0 ? (cfg.subjects || []).length : i) % PALETTE.length]; };
const labIcon = l => /افتراض/.test(l) ? '💻' : /كيمي/.test(l) ? '⚗️' : /فيزي/.test(l) ? '🧲' : /أحيا|احيا/.test(l) ? '🧬' : /علوم/.test(l) ? '🔬' : '🧪';
const LABC = ['#7a3fc4','#2a63cf','#d0701a','#0e8585','#c03a66','#55731b'];
const labColor = l => /كيمي/.test(l) ? LABC[0] : /فيزي/.test(l) ? LABC[1] : /أحيا|احيا/.test(l) ? LABC[2] : /علوم/.test(l) ? LABC[3] : LABC[4 + (Math.max(0, (cfg.labs || []).indexOf(l)) % 2)];
const labSub = ds => dayLabel(ds) + ' • مختبر ' + esc(lab);
const timeOf = p => (cfg.times || [])[p - 1] || '';
const dayLabel = ds => { const d = parse(ds); return DAYS[d.getDay()] + ' ' + dm(d) + '/' + d.getFullYear(); };

/* ================= التحميل والعرض ================= */
async function load(silent) {
  const from = ymd(weekStart), to = ymd(addDays(weekStart, 4));
  try {
    const r = await api('getData', from, to);
    if (r.ok === false) throw new Error(r.msg);
    cfg = r.config; items = r.items || [];
    if (!lab || cfg.labs.indexOf(lab) < 0) lab = cfg.defaultLab;
    render();
  } catch (e) { if (!silent) toast(errMsg(e), 'err'); }
}

function render() {
  $('#labName').textContent = 'مختبر ' + lab;
  $('#schoolName').textContent = cfg.title + (cfg.school ? ' — ' + cfg.school : '');
  $('#logo').textContent = labIcon(lab);
  document.title = cfg.title + ' — ' + lab;

  const wk = items.reduce((m, it) => (m[it.lab] = (m[it.lab] || 0) + (it.type === 'booked' ? 1 : 0), m), {});
  $('#labs').style.setProperty('--k', cfg.labs.length);
  $('#labs').innerHTML = cfg.labs.map(l => `<button class="labtab${l === lab ? ' on' : ''}" style="--lc:${labColor(l)}" data-lab="${esc(l)}">
      <span class="ic">${labIcon(l)}</span><span class="nm">${esc(l)}</span><span class="ct">${wk[l] || 0} حجز<span class="wl"> هذا الأسبوع</span></span></button>`).join('');
  $('#adminBar').hidden = !pin;
  $('#adminBtn').textContent = pin ? '🔓 الفني' : '🔑 الفني';

  const end = addDays(weekStart, 4);
  const thisWeek = ymd(sundayOf(parse(cfg.today))) === ymd(weekStart);
  $('#range').innerHTML = dm(weekStart) + ' – ' + dm(end) + '/' + end.getFullYear() +
    '<small>' + (thisWeek ? 'الأسبوع الحالي' : 'الأحد – الخميس') + '</small>';

  $('#legend').innerHTML =
    '<span><i style="background:var(--freebg);border:1.5px dashed var(--freeline)"></i>متاح</span>' +
    (cfg.subjects || []).map(s => `<span><i style="background:${subjColor(s)}"></i>${esc(s)}</span>`).join('') +
    '<span><i style="background:#e5e9ec"></i>مغلق</span>';

  const map = {};
  items.filter(it => it.lab === lab).forEach(it => map[it.date + '|' + it.period] = it);

  let html = '';
  for (let i = 0; i < 5; i++) {
    const d = addDays(weekStart, i), ds = ymd(d);
    const past = ds < cfg.today, isToday = ds === cfg.today;
    let booked = 0, slots = '';
    for (let p = 1; p <= cfg.periods; p++) {
      const it = map[ds + '|' + p];
      const head = `<span class="pn">الحصة ${p}</span>${timeOf(p) ? `<span class="tm">${esc(timeOf(p))}</span>` : ''}`;
      if (it && it.type === 'booked') {
        booked++;
        slots += `<button class="slot booked${past ? ' past' : ''}" style="--c:${subjColor(it.subject)}" data-d="${ds}" data-p="${p}">
          <span class="lock">🔒</span>${head}
          <span class="who">${esc(it.teacher)}</span>
          <span class="meta">${esc(it.cls)}${it.subject ? ' • ' + esc(it.subject) : ''}</span></button>`;
      } else if (it) {
        booked++;
        slots += `<button class="slot closed${past ? ' past' : ''}" data-d="${ds}" data-p="${p}">${head}
          <span class="st">⛔ ${esc(it.notes || 'مغلق')}</span></button>`;
      } else if (past) {
        slots += `<button class="slot free past" data-d="${ds}" data-p="${p}" ${pin ? '' : 'disabled'}>${head}<span class="st">—</span></button>`;
      } else {
        slots += `<button class="slot free" data-d="${ds}" data-p="${p}">${head}<span class="st">＋ متاح</span></button>`;
      }
    }
    html += `<section class="day${isToday ? ' today' : ''}">
      <div class="dayhead"><h3>${DAYS[d.getDay()]}<small>${dm(d)}</small>${isToday ? '<span class="tag">اليوم</span>' : ''}</h3>
      <span class="count">${booked}/${cfg.periods} محجوزة</span></div>
      <div class="slots" style="--n:${cfg.periods}">${slots}</div></section>`;
  }
  $('#days').innerHTML = html;
}

$('#days').addEventListener('click', e => {
  const b = e.target.closest('.slot'); if (!b || b.disabled) return;
  const ds = b.dataset.d, p = Number(b.dataset.p);
  const it = items.find(x => x.lab === lab && x.date === ds && x.period === p);
  if (it) return showDetails(it);
  if (ds < cfg.today) return;
  showBookForm(ds, p);
});

$('#labs').addEventListener('click', e => {
  const b = e.target.closest('.labtab'); if (!b || b.dataset.lab === lab) return;
  lab = b.dataset.lab; render();
});

/* ================= النوافذ ================= */
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function head(title, sub, color) {
  return `<div class="shead">${color ? `<span class="dot" style="background:${color}"></span>` : ''}
    <div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="x" data-close>×</button></div>`;
}
function subjectChips(sel) {
  const list = cfg.subjects || [];
  return `<div class="chips">${list.map((s, i) => `<label style="--c:${subjColor(s)}"><input type="radio" name="subject" value="${esc(s)}" ${s === sel || (!sel && i === 0) ? 'checked' : ''}><span>${esc(s)}</span></label>`).join('')}</div>`;
}
function formFields(v) {
  v = v || {};
  return `
    <div class="field"><label>اسم المعلم</label><input name="teacher" value="${esc(v.teacher)}" placeholder="مثال: أحمد بن سالم" autocomplete="name"></div>
    <div class="field"><label>المادة</label>${subjectChips(v.subject)}</div>
    <div class="field"><label>الصف / الشعبة</label><input name="cls" value="${esc(v.cls)}" placeholder="مثال: 10/3"></div>
    <div class="field"><label>الدرس أو التجربة <em>(اختياري)</em></label><input name="lesson" value="${esc(v.lesson)}" placeholder="مثال: تفاعل الأحماض مع القواعد"></div>
    <div class="field"><label>ملاحظات للفني <em>(اختياري)</em></label><textarea name="notes" placeholder="الأدوات أو المواد المطلوبة تجهيزها">${esc(v.notes)}</textarea></div>`;
}
function readForm() {
  const f = $('#sheet');
  const g = n => (f.querySelector(`[name="${n}"]`) || {}).value || '';
  const s = f.querySelector('[name="subject"]:checked');
  return { teacher: g('teacher').trim(), cls: g('cls').trim(), lesson: g('lesson').trim(), notes: g('notes').trim(), subject: s ? s.value : '' };
}
function setBusy(btn, on, label) { busy = on; if (btn) { btn.disabled = on; if (label) btn.textContent = label; } }

function showBookForm(ds, p) {
  const sub = labSub(ds) + (timeOf(p) ? ' • ' + esc(timeOf(p)) : '');
  openModal(head(labIcon(lab) + ' حجز الحصة ' + p, sub, labColor(lab)) + `
    <div class="sbody">${formFields({ teacher: store('labTeacher') || '' })}
      <div class="note">⚠️ بعد تأكيد الحجز تُقفَل الحصة باسمك، ولا يمكن تعديلها أو إلغاؤها إلا من فني المختبر.</div>
    </div>
    <div class="sfoot">
      <button class="btn primary" id="okBook">✔ تأكيد الحجز</button>
      ${pin ? '<button class="btn ghost" id="closeSlot">⛔ إغلاق الحصة</button>' : ''}
      <button class="btn" data-close>إلغاء</button>
    </div>`);
  $('#okBook').onclick = async () => {
    if (busy) return;
    const d = readForm();
    if (!d.teacher) return toast('اكتب اسم المعلم', 'err');
    if (!d.cls) return toast('اكتب الصف / الشعبة', 'err');
    const btn = $('#okBook'); setBusy(btn, true, 'جاري الحجز…');
    try {
      const r = await api('book', Object.assign(d, { lab, date: ds, period: p }));
      if (r.ok) { store('labTeacher', d.teacher); closeModal(); toast('تم حجز الحصة ' + p + ' في مختبر ' + lab + ' ✔', 'ok'); }
      else { toast(r.msg, 'err'); if (r.conflict) closeModal(); }
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false, '✔ تأكيد الحجز'); load(true);
  };
  if (pin) $('#closeSlot').onclick = () => showCloseForm(ds, p);
}

function showCloseForm(ds, p) {
  openModal(head('إغلاق الحصة ' + p, labSub(ds), '#9aa6ad') + `
    <div class="sbody"><div class="field"><label>سبب الإغلاق</label><input name="reason" placeholder="مثال: صيانة / اختبار / نشاط" value="صيانة"></div></div>
    <div class="sfoot"><button class="btn primary" id="okClose">إغلاق الحصة</button><button class="btn" data-close>إلغاء</button></div>`);
  $('#okClose').onclick = async () => {
    const btn = $('#okClose'); setBusy(btn, true, 'جاري…');
    try {
      const r = await api('adminClose', pin, lab, ds, p, $('#sheet [name=reason]').value);
      if (r.ok) { closeModal(); toast('تم إغلاق الحصة', 'ok'); } else toast(r.msg, 'err');
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false); load(true);
  };
}

function showDetails(it) {
  const closed = it.type === 'closed';
  const color = closed ? '#9aa6ad' : subjColor(it.subject);
  const sub = labSub(it.date) + (timeOf(it.period) ? ' • ' + esc(timeOf(it.period)) : '');
  const info = closed
    ? `<dl class="info"><dt>الحالة</dt><dd>مغلقة</dd><dt>السبب</dt><dd>${esc(it.notes || '—')}</dd></dl>`
    : `<dl class="info">
        <dt>المعلم</dt><dd>${esc(it.teacher)}</dd>
        <dt>المادة</dt><dd>${esc(it.subject || '—')}</dd>
        <dt>الصف</dt><dd>${esc(it.cls || '—')}</dd>
        <dt>الدرس</dt><dd>${esc(it.lesson || '—')}</dd>
        ${it.notes ? `<dt>ملاحظات</dt><dd>${esc(it.notes)}</dd>` : ''}
        <dt>وقت الحجز</dt><dd style="font-weight:500">${esc(it.created || '—')}</dd></dl>`;
  const foot = pin
    ? `${closed ? '' : '<button class="btn" id="editB">✏️ تعديل</button>'}
       <button class="btn danger" id="delB">${closed ? '🔓 فتح الحصة' : '🗑️ حذف الحجز'}</button>
       <button class="btn ghost" data-close>إغلاق</button>`
    : `<button class="btn" data-close>حسنًا</button>`;
  openModal(head((closed ? 'حصة مغلقة' : 'حصة محجوزة') + ' — الحصة ' + it.period, sub, color) + `
    <div class="sbody">${info}
      ${pin ? '' : `<div class="lockbox"><b>🔒 هذه الحصة مقفلة</b>لا يمكن تعديلها أو حذفها إلا من قِبَل فني المختبر.<br>للتعديل تواصل مع الفني.</div>`}
    </div><div class="sfoot">${foot}</div>`);
  if (!pin) return;
  $('#delB').onclick = async () => {
    if (!confirm(closed ? 'فتح هذه الحصة للحجز؟' : 'حذف حجز ' + it.teacher + ' نهائيًا؟')) return;
    const btn = $('#delB'); setBusy(btn, true, 'جاري…');
    try {
      const r = await api('adminDelete', pin, it.id);
      if (r.ok) { closeModal(); toast(closed ? 'أصبحت الحصة متاحة' : 'تم حذف الحجز', 'ok'); } else toast(r.msg, 'err');
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false); load(true);
  };
  if (!closed) $('#editB').onclick = () => showEditForm(it);
}

function showEditForm(it) {
  openModal(head('تعديل الحجز — الحصة ' + it.period, labSub(it.date), subjColor(it.subject)) + `
    <div class="sbody">${formFields(it)}</div>
    <div class="sfoot"><button class="btn primary" id="okEdit">💾 حفظ التعديل</button><button class="btn" data-close>إلغاء</button></div>`);
  $('#okEdit').onclick = async () => {
    const d = readForm(); if (!d.teacher) return toast('اكتب اسم المعلم', 'err');
    const btn = $('#okEdit'); setBusy(btn, true, 'جاري الحفظ…');
    try {
      const r = await api('adminUpdate', pin, it.id, d);
      if (r.ok) { closeModal(); toast('تم حفظ التعديل', 'ok'); } else toast(r.msg, 'err');
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false); load(true);
  };
}

/* ================= الفني ================= */
$('#adminBtn').onclick = () => {
  if (pin) return toast('أنت في وضع الفني — اضغط على أي حصة لإدارتها');
  openModal(head('دخول فني المختبر', 'خاص بفني المختبر فقط', 'var(--brand)') + `
    <div class="sbody"><div class="field"><label>الرمز السري</label>
      <input name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" style="text-align:center;font-size:22px;letter-spacing:6px"></div></div>
    <div class="sfoot"><button class="btn primary" id="okPin">دخول</button><button class="btn" data-close>إلغاء</button></div>`);
  const inp = $('#sheet [name=pin]'); setTimeout(() => inp.focus(), 50);
  const go = async () => {
    const btn = $('#okPin'); setBusy(btn, true, 'جاري التحقق…');
    try {
      const r = await api('adminLogin', inp.value);
      if (r.ok) { pin = inp.value; sstore('labPin', pin); closeModal(); render(); toast('تم الدخول كفني المختبر 🔓', 'ok'); }
      else { toast(r.msg, 'err'); inp.select(); }
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false, 'دخول');
  };
  $('#okPin').onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
};
$('#outBtn').onclick = () => { pin = null; sstore('labPin', null); render(); toast('تم الخروج من وضع الفني'); };
$('#printBtn').onclick = () => window.print();

$('#setBtn').onclick = () => {
  const times = Array.from({ length: 10 }, (_, i) => (cfg.times || [])[i] || '');
  openModal(head('⚙️ إعدادات الجدول', 'تُطبَّق على جميع المعلمين', 'var(--brand)') + `
    <div class="sbody">
      <div class="field"><label>اسم المدرسة</label><input name="school" value="${esc(cfg.school)}"></div>
      <div class="field"><label>عنوان الصفحة</label><input name="title" value="${esc(cfg.title)}"></div>
      <div class="field"><label>المختبرات <em>(افصل بينها بفاصلة، بالترتيب الذي تظهر به)</em></label><input name="labs" value="${esc(cfg.labs.join('، '))}"></div>
      <div class="field"><label>المختبر الذي يظهر أولًا عند فتح الرابط</label><input name="defaultLab" value="${esc(cfg.defaultLab)}" list="labList"><datalist id="labList">${cfg.labs.map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>
      <div class="field"><label>عدد الحصص في اليوم</label><input name="periods" type="number" min="1" max="10" value="${cfg.periods}"></div>
      <div class="field"><label>بداية كل حصة <em>(اختياري)</em></label>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${times.map((t, i) => `<input name="t${i}" value="${esc(t)}" placeholder="ح${i + 1}" style="padding:8px;text-align:center">`).join('')}</div></div>
      <div class="field"><label>المواد <em>(افصل بينها بفاصلة)</em></label><input name="subjects" value="${esc((cfg.subjects || []).join('، '))}"></div>
      <div class="field"><label>رمز سري جديد للفني <em>(اتركه فارغًا لعدم التغيير)</em></label><input name="newPin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="4 أرقام على الأقل"></div>
    </div>
    <div class="sfoot"><button class="btn primary" id="okSet">💾 حفظ</button><button class="btn" data-close>إلغاء</button></div>`);
  $('#okSet').onclick = async () => {
    const g = n => $('#sheet [name="' + n + '"]').value.trim();
    const n = Math.max(1, Math.min(10, Number(g('periods')) || 8));
    const c = {
      school: g('school'), title: g('title'), periods: n,
      labs: g('labs').split(/[,،]/).map(s => s.trim()).filter(Boolean), defaultLab: g('defaultLab'),
      times: Array.from({ length: n }, (_, i) => g('t' + i)),
      subjects: g('subjects').split(/[,،]/).map(s => s.trim()).filter(Boolean),
      newPin: g('newPin')
    };
    if (c.newPin && c.newPin.length < 4) return toast('الرمز السري 4 أرقام على الأقل', 'err');
    const btn = $('#okSet'); setBusy(btn, true, 'جاري الحفظ…');
    try {
      const r = await api('adminSaveConfig', pin, c);
      if (r.ok) { if (c.newPin) { pin = c.newPin; sstore('labPin', pin); } closeModal(); toast('تم حفظ الإعدادات', 'ok'); }
      else toast(r.msg, 'err');
    } catch (e) { toast(errMsg(e), 'err'); }
    setBusy(btn, false); load(true);
  };
};

/* ================= التنقل والمشاركة ================= */
$('#prevW').onclick = () => { weekStart = addDays(weekStart, -7); render(); load(); };
$('#nextW').onclick = () => { weekStart = addDays(weekStart, 7); render(); load(); };
$('#nowW').onclick = () => { const t = parse(cfg.today); weekStart = sundayOf(t); if (t.getDay() >= 5) weekStart = addDays(weekStart, 7); load(); };
$('#shareBtn').onclick = () => {
  const url = IS_GAS ? (cfg.url || location.href) : location.href.split(/[?#]/)[0];
  const text = `🧪 ${cfg.title}${cfg.school ? ' — ' + cfg.school : ''}\nالمختبرات: ${cfg.labs.join(' • ')}\nاحجز حصتك من الرابط:\n${url}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};

let tId;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(tId); tId = setTimeout(() => t.className = 'toast', 3200);
}

/* تحديث تلقائي كل 45 ثانية لرؤية حجوزات الآخرين */
setInterval(() => { if (!document.hidden && !$('#modal').classList.contains('open')) load(true); }, 45000);

/* ================= وضع المعاينة (خارج Google فقط) ================= */
const Mock = (() => {
  const t = new Date(), today = ymd(t), ws = sundayOf(t.getDay() >= 5 ? addDays(t, 7) : t);
  const c = { school: 'مدرسة (معاينة)', title: 'حجز المختبرات', labs: ['كيمياء','فيزياء','أحياء','علوم (افتراضي)'], defaultLab: 'علوم (افتراضي)', periods: 8, times: ['7:30','8:15','9:00','9:45','10:50','11:35','12:20','13:05'], subjects: ['فيزياء','كيمياء','أحياء','علوم','أخرى'] };
  let P = '1234', rows = [
    { lab: 'علوم (افتراضي)', id: 'a1', date: ymd(addDays(ws, 1)), period: 2, type: 'booked', teacher: 'أ. خالد الحارثي', subject: 'كيمياء', cls: '11/2', lesson: 'معايرة حمض وقاعدة', notes: '', created: today + ' 08:10' },
    { lab: 'أحياء', id: 'a2', date: ymd(addDays(ws, 1)), period: 5, type: 'booked', teacher: 'أ. مريم البلوشية', subject: 'أحياء', cls: '10/4', lesson: 'فحص الخلية بالمجهر', notes: 'مجهر لكل مجموعة', created: today + ' 09:02' },
    { lab: 'فيزياء', id: 'a3', date: ymd(addDays(ws, 2)), period: 3, type: 'booked', teacher: 'أ. سالم الرواحي', subject: 'فيزياء', cls: '12/1', lesson: 'قانون أوم', notes: '', created: today + ' 07:40' },
    { lab: 'علوم (افتراضي)', id: 'a4', date: ymd(addDays(ws, 3)), period: 1, type: 'closed', teacher: 'فني المختبر', subject: '', cls: '', lesson: '', notes: 'صيانة', created: today },
    { lab: 'علوم (افتراضي)', id: 'a5', date: ymd(addDays(ws, 4)), period: 6, type: 'booked', teacher: 'أ. عائشة الكندية', subject: 'علوم', cls: '9/2', lesson: 'الكثافة', notes: '', created: today + ' 10:15' }
  ];
  const wait = v => new Promise(r => setTimeout(() => r(v), 250));
  const no = m => wait({ ok: false, msg: m });
  return {
    getData: (f, to) => wait({ config: Object.assign({}, c, { today, url: '' }), items: rows.filter(r => r.date >= f && r.date <= to).map(r => Object.assign({}, r)) }),
    book: d => rows.some(r => r.lab === d.lab && r.date === d.date && r.period === d.period) ? wait({ ok: false, msg: 'هذه الحصة حُجزت للتو', conflict: true })
      : (rows.push(Object.assign({ id: Math.random().toString(36).slice(2, 8), type: 'booked', created: today }, d)), wait({ ok: true })),
    adminLogin: p => wait(p === P ? { ok: true } : { ok: false, msg: 'رمز الفني غير صحيح' }),
    adminDelete: (p, id) => p !== P ? no('غير مصرح') : (rows = rows.filter(r => r.id !== id), wait({ ok: true })),
    adminUpdate: (p, id, d) => p !== P ? no('غير مصرح') : (Object.assign(rows.find(r => r.id === id), d), wait({ ok: true })),
    adminClose: (p, lab, date, period, reason) => p !== P ? no('غير مصرح') : (rows.push({ id: 'c' + Date.now(), lab, date, period, type: 'closed', teacher: 'فني المختبر', notes: reason || 'مغلق' }), wait({ ok: true })),
    adminSaveConfig: (p, n) => p !== P ? no('غير مصرح') : (Object.assign(c, n), n.newPin && (P = n.newPin), wait({ ok: true }))
  };
})();

load();
</script>
